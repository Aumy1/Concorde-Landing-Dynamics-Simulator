name: MATLAB verification and portfolio build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up base MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026b
      - name: Test, simulate and export evidence
        uses: matlab-actions/run-command@v3
        with:
          command: build_portfolio
      - name: Upload test and simulation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matlab-landing-evidence
          path: |
            results/
            docs/VALIDATION.md
          if-no-files-found: warn
